[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentic-research-assistant"
version = "0.1.0"
description = "Multi-Agent LLM-RAG Framework for Autonomous Scientific Literature Mining"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.8.0",
    "tiktoken==0.7.0",
    "pymupdf==1.24.3",
    "httpx==0.27.0",
    "weasyprint==61.2",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "numpy==1.26.4",
    "aiofiles==23.2.1",
    "markdown==3.6",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "tenacity==8.3.0",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "hypothesis==6.100.1",
    "respx==0.21.1",
    "faker==25.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
